[project]
name = "betterstack-gateway-operator"
version = "0.6.0"
description = "Keeps uptime monitors in sync with the hostnames a cluster serves, from Gateway API HTTPRoutes"
requires-python = ">=3.11"
dependencies = [
    "kopf>=1.37",
    "kubernetes-asyncio>=32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
